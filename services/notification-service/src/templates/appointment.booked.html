<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Appointment Requested</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:24px">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:8px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.1)">
    <h2 style="color:#2563EB;margin-top:0">Appointment Requested</h2>
    <p>Hello <strong>{patientName}</strong>,</p>
    <p>Your appointment request has been sent to <strong>Dr. {doctorName}</strong>.</p>
    <table style="width:100%;border-collapse:collapse;margin:16px 0">
      <tr><td style="padding:8px;color:#6B7280">Date</td><td style="padding:8px;font-weight:bold">{date}</td></tr>
      <tr style="background:#F9FAFB"><td style="padding:8px;color:#6B7280">Time</td><td style="padding:8px;font-weight:bold">{slotTime}</td></tr>
      <tr><td style="padding:8px;color:#6B7280">Reference</td><td style="padding:8px;font-family:monospace">{appointmentId}</td></tr>
    </table>
    <p style="color:#6B7280;font-size:14px">You will receive another notification once the doctor confirms your appointment.</p>
    <hr style="border:none;border-top:1px solid #E5E7EB;margin:24px 0">
    <p style="color:#9CA3AF;font-size:12px;text-align:center">MediConnect Healthcare Platform</p>
  </div>
</body>
</html>
