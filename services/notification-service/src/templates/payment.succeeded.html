<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Payment Received</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:24px">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:8px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.1)">
    <h2 style="color:#16A34A;margin-top:0">Payment Received ✓</h2>
    <p>Your payment has been successfully processed.</p>
    <table style="width:100%;border-collapse:collapse;margin:16px 0">
      <tr><td style="padding:8px;color:#6B7280">Amount</td><td style="padding:8px;font-weight:bold;font-size:18px;color:#16A34A">{amount}</td></tr>
      <tr style="background:#F9FAFB"><td style="padding:8px;color:#6B7280">Appointment</td><td style="padding:8px;font-family:monospace">{appointmentId}</td></tr>
      <tr><td style="padding:8px;color:#6B7280">Payment Ref</td><td style="padding:8px;font-family:monospace">{paymentId}</td></tr>
    </table>
    <div style="background:#F0FDF4;border-left:4px solid #16A34A;padding:12px 16px;border-radius:4px;margin:16px 0">
      <p style="margin:0;font-size:14px;color:#15803D">
        Your appointment is now confirmed. Please check your email for consultation details.
      </p>
    </div>
    <hr style="border:none;border-top:1px solid #E5E7EB;margin:24px 0">
    <p style="color:#9CA3AF;font-size:12px;text-align:center">MediConnect Healthcare Platform</p>
  </div>
</body>
</html>
