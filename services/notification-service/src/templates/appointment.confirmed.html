<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Appointment Confirmed</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:24px">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:8px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.1)">
    <h2 style="color:#16A34A;margin-top:0">Appointment Confirmed ✓</h2>
    <p>Your appointment has been <strong>confirmed</strong>.</p>
    <table style="width:100%;border-collapse:collapse;margin:16px 0">
      <tr><td style="padding:8px;color:#6B7280">Date</td><td style="padding:8px;font-weight:bold">{date}</td></tr>
      <tr style="background:#F9FAFB"><td style="padding:8px;color:#6B7280">Time</td><td style="padding:8px;font-weight:bold">{slotTime}</td></tr>
      <tr><td style="padding:8px;color:#6B7280">Agora Channel</td><td style="padding:8px;font-family:monospace;color:#2563EB">{agoraChannelName}</td></tr>
      <tr style="background:#F9FAFB"><td style="padding:8px;color:#6B7280">Reference</td><td style="padding:8px;font-family:monospace">{appointmentId}</td></tr>
    </table>
    <div style="background:#EFF6FF;border-left:4px solid #2563EB;padding:12px 16px;border-radius:4px;margin:16px 0">
      <p style="margin:0;font-size:14px;color:#1E40AF">
        For video consultation, use the Agora channel name above in the MediConnect app.
      </p>
    </div>
    <hr style="border:none;border-top:1px solid #E5E7EB;margin:24px 0">
    <p style="color:#9CA3AF;font-size:12px;text-align:center">MediConnect Healthcare Platform</p>
  </div>
</body>
</html>
