<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Consultation Complete</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:24px">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:8px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.1)">
    <h2 style="color:#7C3AED;margin-top:0">Consultation Complete</h2>
    <p>Your consultation has been marked as <strong>complete</strong>.</p>
    <table style="width:100%;border-collapse:collapse;margin:16px 0">
      <tr><td style="padding:8px;color:#6B7280">Appointment</td><td style="padding:8px;font-family:monospace">{appointmentId}</td></tr>
      <tr style="background:#F9FAFB"><td style="padding:8px;color:#6B7280">Prescription ID</td><td style="padding:8px;font-family:monospace">{prescriptionId}</td></tr>
    </table>
    <div style="background:#F5F3FF;border-left:4px solid #7C3AED;padding:12px 16px;border-radius:4px;margin:16px 0">
      <p style="margin:0;font-size:14px;color:#5B21B6">
        Your prescription has been issued. Log in to MediConnect to view medications and instructions.
      </p>
    </div>
    <hr style="border:none;border-top:1px solid #E5E7EB;margin:24px 0">
    <p style="color:#9CA3AF;font-size:12px;text-align:center">MediConnect Healthcare Platform</p>
  </div>
</body>
</html>
