# Development overrides – hot-reload via volume mounts + nodemon
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api-gateway:
    build:
      target: development
    volumes:
      - ./services/api-gateway/src:/app/src:delegated
    environment:
      NODE_ENV: development
    command: ['npx', 'nodemon', 'src/index.js']

  auth-service:
    build:
      target: development
    volumes:
      - ./services/auth-service/src:/app/src:delegated
      - ./shared:/shared:delegated
    environment:
      NODE_ENV: development
    command: ['npx', 'nodemon', 'src/index.js']

